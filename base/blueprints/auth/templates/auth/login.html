{% extends "base.html" %}

{% block titulo %}Login{% endblock %}

{% block conteudo %}
<h1>Entrar</h1>
{% if erro %}
    <p class="erro">{{ erro }}</p>
{% endif %}
<form method="post">
    <input name="nome" placeholder="Nome" />
    <input name="senha" type="password" placeholder="Senha" />
    <button>Entrar</button>
    <a href="{{ url_for('catalog.index') }}">Voltar</a>
</form>
{% endblock %}
