{% extends "base.html" %}

{% block titulo %}Catalogo Livraria{% endblock %}

{% block conteudo %}
<h1>Catalogo de livros</h1>
<form method="get" action="{{ url_for('index') }}">
    <label for="q">Buscar pelo titulo</label>
    <input id="q" name="q" value="{{ query }}" placeholder="Digite um titulo">
    <button type="submit">Buscar</button>
</form>

{% for livro in livros %}
    <div class="card">
        <h2><a href="{{ url_for('livro', livro_id=livro['id']) }}">{{ livro['titulo'] }}</a></h2>
        <p>Autor: {{ livro['autor'] }}</p>
        <p>Ano: {{ livro['ano'] }}</p>
    </div>
{% else %}
    <p>Nenhum livro achado</p>
{% endfor %}
{% endblock %}
